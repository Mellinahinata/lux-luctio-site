
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lux Luctio | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="pagina-login">

        <img src="logo-lux.png" alt="Lux Luctio" class="logo">

        <section class="conteudo">
            <div class="titulo-login">
                <img src="emu.png" alt="Emu" class="emu">
                <h1>LOGIN</h1>
            </div>

            <p class="subtitulo">Bem-vinda de volta!</p>

            <form>
                <label for="usuario">Usuário</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Digite seu usuário"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <div class="opcoes">
                    <label class="lembrar">
                        <input type="checkbox" name="lembrar">
                        Lembrar de mim
                    </label>

                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit">ENTRAR</button>

                <p class="cadastro">
                    Não tem uma conta?
                    <a href="#">Cadastre-se</a>
                </p>
            </form>
        </section>

        <img
            src="detalhe-explosao.png"
            alt=""
            class="explosao decoracao"
        >

        <img
            src="detalhe-linha.png"
            alt=""
            class="linha decoracao"
        >

        <img src="fita2.png" alt="" class="fita fita-um">
        <img src="fita3.png" alt="" class="fita fita-dois">

        <img
            src="personagem.png"
            alt=""
            class="personagem"
        >

    </main>

</body>
</html>
